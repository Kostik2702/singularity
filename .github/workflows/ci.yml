name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast suite across the three supported OSes — no ML stack (fake encoder /
  # stubbed model), so it installs only the light runtime deps and runs in
  # seconds. This is the gate.
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install light test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run fast test suite
        env:
          MB_HOME: ${{ runner.temp }}/mb-vault
        run: |
          python -m pytest -q

  # Optional heavy smoke: installs the full ML stack and exercises a real
  # encode + index. Manual only (workflow_dispatch) so the ML download never
  # blocks the fast gate.
  ml-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run ML smoke (marked slow)
        run: |
          python -m pytest -q -m ml_smoke

  # Opt-in end-to-end against a REAL @google/gemini-cli across the three OSes.
  # Manual only (workflow_dispatch); needs no Google credentials — the test only
  # probes `gemini --version` and drives register/doctor/uninstall in an isolated
  # HOME. The test auto-skips if the CLI is somehow absent.
  gemini-e2e:
    if: github.event_name == 'workflow_dispatch'
    name: gemini-e2e ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest
      - name: Install light test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run Gemini E2E (real client, isolated HOME)
        env:
          GEMINI_CLI_NO_UPDATE: "1"
        run: |
          python -m pytest -q -m gemini_e2e
