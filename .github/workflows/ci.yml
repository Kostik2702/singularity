name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast suite across the three supported OSes — no ML stack (fake encoder /
  # stubbed model), so it installs only the light runtime deps and runs in
  # seconds. This is the gate.
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install light test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run fast test suite
        env:
          MB_HOME: ${{ runner.temp }}/mb-vault
        run: |
          python -m pytest -q

  # Optional heavy smoke: installs the full ML stack and exercises a real
  # encode + index. Manual only (workflow_dispatch) so the ML download never
  # blocks the fast gate.
  ml-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run ML smoke (marked slow)
        run: |
          python -m pytest -q -m ml_smoke
