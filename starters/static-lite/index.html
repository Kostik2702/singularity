<!-- static-lite starter (WSF-10, WEBSITE-FACTORY). Conventions baked in:
     - tokens-first styling (css/tokens.css is the only place for colors/sizes)
     - every dynamic module = js/modules/<name>.js + data-module hook + safeInit
     - visual-test determinism contract: ?visual-test=1 kills animations and
       every canvas draws ONE seeded frame (see js/main.js + css kill-switch)
     - decor layers follow the live-only convention (OFF under visual-test and
       reduced-motion) so visual baselines stay byte-stable
     - content placeholders are truth-gated: __DOUBLE_UNDERSCORE__ values are
       NOT facts and must be replaced via the owner (NIKA truth-gate lesson) -->

</main>
