<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>fixture: good scene recovery</title>
<style>@media (prefers-reduced-motion: reduce){ .x{animation:none} }
canvas{width:300px;height:200px}</style></head><body>
<main><h1>Good recovery</h1><p>WebGL scene listens for webglcontextrestored
and repaints — the scene-recovery gate must pass.</p>
<canvas id="c" width="300" height="200"></canvas></main>
<script>
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl");
  function paint() {
    gl.clearColor(0.2, 0.9, 0.4, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
  paint();
  canvas.addEventListener("webglcontextlost", (e) => e.preventDefault());
  canvas.addEventListener("webglcontextrestored", () => paint());
</script>
</body></html>
