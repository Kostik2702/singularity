[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity"
version = "0.1.0"
description = "Singularity — personal AI memory system: Obsidian-native automatic memory + semantic search (Memory Brain engine)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=2.6"]
secrets = ["keyring>=24"]

[project.scripts]
mb = "singularity.cli:main"

[tool.setuptools.packages.find]
include = ["singularity*"]
