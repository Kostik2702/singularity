[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity"
version = "0.5.1"
description = "Singularity — personal AI memory system: Obsidian-native automatic memory + semantic search (Memory Brain engine)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Upper bound is deliberate: sentence-transformers 5.x imports `torchcodec`
# unconditionally (multimodal support), and torchcodec needs FFmpeg *shared
# libraries* on the host — a system dependency this project has no use for, it
# only embeds text. On a Windows box without the "full-shared" FFmpeg build the
# 5.x import dies with `RuntimeError: Could not load libtorchcodec`, taking the
# search daemon down with it (observed 2026-07-28).
ml = ["sentence-transformers>=2.6,<5"]
secrets = ["keyring>=24"]
# imgqa: deterministic image-QA CLI (WSF-01). Pillow/scipy only — heavy ML
# (rembg/onnxruntime) intentionally lives in a separate venv (D:\venvs\imgqa-ml,
# owner decision OD-1 2026-07-14) and is reached via the `cutout` dispatch
# subcommand, so this extras group can never drag numpy pins that break `mb`.
imgqa = ["Pillow>=10", "scipy>=1.10"]

[project.scripts]
mb = "singularity.cli:main"
imgqa = "singularity.imgqa.cli:main"
design-scout = "singularity.scout.cli:main"
pattern-scout = "singularity.providers.cli:main"
component-intake = "singularity.intake.cli:main"
golden = "singularity.golden.cli:main"
factory = "singularity.factory.cli:main"

[tool.setuptools.packages.find]
include = ["singularity*"]

[tool.pytest.ini_options]
markers = [
    "ml_smoke: heavy end-to-end test needing the real ML stack (opt-in, CI workflow_dispatch only)",
    "gemini_e2e: end-to-end test needing a real @google/gemini-cli on PATH (opt-in; auto-skips when absent)",
    "grok_e2e: end-to-end test needing a real Grok Build CLI on PATH (opt-in; auto-skips when absent; no xAI credentials)",
    "imgqa_gt: full-image imgqa ground-truth tests against the NIKA tree (auto-skips unless IMGQA_GT_ROOT is set)",
    "real_scheduler: test genuinely drives singularity.platform.scheduler — opts out of the conftest guard that otherwise fails a test for touching the real OS scheduler",
    "real_user_path: test genuinely writes the Windows user PATH (HKCU\\Environment) — opts out of the conftest guard that otherwise fails a test for mutating the developer's environment",
    "real_version_managers: test genuinely probes the version-manager locations (~/.nvm, ~/.volta, /usr/local/bin …) — opts out of the conftest guard that otherwise empties that search list",
]
